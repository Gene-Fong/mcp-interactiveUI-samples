[project]
name = "sn-mcp-copilot"
version = "0.5.0"
description = "Ask - ServiceNow — MCP server + widget for M365 Copilot"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.26.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "structlog>=24.1.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.3.0",
    "cachetools>=5.3.0",
]

[project.scripts]
sn-mcp-copilot = "servicenow_mcp.servicenow_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servicenow_mcp"]
